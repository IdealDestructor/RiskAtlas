[project]
name = "yutu-api"
version = "1.0.0"
description = "舆图 · LLM 驱动的实时实体风险情报平台 — 后端 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis[hiredis]>=5.1",
    "httpx>=0.27",
    "openai>=1.50",
    "anthropic>=0.40",
    "trafilatura>=1.12",
    "datasketch>=1.6",
    "feedparser>=6.0",
    "python-dateutil>=2.9",
    "structlog>=24.4",
    "tenacity>=9.0",
    "sse-starlette>=2.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "pytest-cov>=5.0",
    "freezegun>=1.5",
]
