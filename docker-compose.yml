services:
  web:
    image: riskatlas-web
    container_name: riskatlas-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api/v1}
      API_INTERNAL_BASE: http://api:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: riskatlas-api
    container_name: riskatlas-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-riskatlas}:${POSTGRES_PASSWORD:-riskatlas}@postgres:5432/${POSTGRES_DB:-riskatlas}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: riskatlas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riskatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskatlas}
      POSTGRES_DB: ${POSTGRES_DB:-riskatlas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riskatlas} -d ${POSTGRES_DB:-riskatlas}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: riskatlas-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
